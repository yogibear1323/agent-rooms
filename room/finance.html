      </div>
      <div class="head-meta">
        <h1 id="agent-name">Agent</h1>
        <div class="state-row">

      </div>
      <div class="head-actions">
        <button type="button" class="primary" id="run-btn" disabled>Run</button>
        <div class="run-note" id="run-note"></div>
      </div>
    </div>

    <div class="cols">
      <section class="panel" id="sources-panel">
        <div class="panel-head">
          <h2 class="head-with-radar">
            Sources being scanned
            <span class="radar" id="radar" data-active="false" aria-hidden="true">
              <span class="radar-ring"></span>
              <span class="radar-ring"></span>
              <span class="radar-dot"></span>
            </span>
          </h2>
        </div>
        <div class="feed" id="source-feed"></div>
      </section>

      <section class="panel draft-pane">
        <div class="panel-head"><h2>Now drafting</h2></div>
        <div class="draft-meta" id="draft-meta"></div>
        <div class="draft-body" id="draft-body"></div>
        <textarea class="draft-edit" id="draft-edit" hidden></textarea>
        <div class="draft-actions" id="draft-actions" hidden></div>
      </section>

      <section class="panel" id="queue-panel">
        <div class="panel-head">
          <h2>Queue <span class="queue-badge" id="queue-badge">0</span></h2>
        </div>
        <div class="queue" id="queue"></div>
      </section>
    </div>

    <div class="lower" id="lower"></div>

    <section class="panel console" id="console-wrap" hidden>
      <div class="panel-head"><h2>Run console</h2></div>
      <pre id="console-log"></pre>
    </section>

    <p class="footer-note">
      Approve and reject only save a decision in <code>room/decisions.json</code>.
      This dashboard does not send mail. File contract: <a href="../README.md">CONTRACT.md</a>
    </p>
  </div>
