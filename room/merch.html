<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Room — Agent Hub</title>
  <link rel="stylesheet" href="../css/app.css?v=hud6">
</head>
<body class="hud static">
  <div class="space" aria-hidden="true"><div class="starfield" id="stars"></div></div>
  <div class="room-wrap room" id="room">
    <header class="room-top">
      <a class="brand" href="../index.html">
        <svg class="crosshair" viewBox="0 0 28 28" aria-hidden="true">
          <circle cx="14" cy="14" r="11" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="14" cy="14" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <path d="M14 2v6M14 20v6M2 14h6M20 14h6" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        <div class="brand-text">
          <strong>AGENT HUB</strong>
          <span class="crumb"><a href="../index.html">Floor</a> / <span id="crumb-name">Room</span></span>
        </div>
      </a>
      <div class="hud-readouts">
        <span class="off">NO MAIL UPLINK</span>
        <span>AUDIO OFF</span>
      </div>
    </header>

    <div id="live-banner" class="banner hidden"></div>

    <div class="room-head">
      <div class="char-card">
        <div class="char-stage" id="char-stage"></div>
      </div>
      <div class="head-meta">
        <h1 id="agent-name">Agent</h1>
        <div class="state-row">
          <span class="light" id="state-light" data-state="idle"></span>
          <span class="state-label" id="state-label">IDLE</span>
          <span class="lv-big" id="lv-readout">LV 1</span>
          <span class="step" id="step"></span>
        </div>
      </div>
      <div class="head-actions">
        <button type="button" class="primary" id="run-btn" disabled>Run</button>
        <div class="run-note" id="run-note"></div>
      </div>
    </div>

    <div class="stats-strip" id="stats-strip"></div>

    <div class="room-cols" id="room-cols">
      <section>
        <div class="panel">
          <div class="panel-inner">
            <div class="panel-head">COMMS</div>
            <div id="comms" class="comms-list"></div>
            <div id="now-draft" hidden>
              <div class="draft-meta" id="draft-meta"></div>
              <div class="draft-body" id="draft-body"></div>
              <textarea class="draft-edit" id="draft-edit" hidden></textarea>
              <div class="draft-actions" id="draft-actions" hidden></div>
            </div>
            <div id="data-panels"></div>
          </div>
        </div>
      </section>
      <section id="outbox-panel">
        <div class="panel">
          <div class="panel-inner">
            <div class="panel-head">OUTBOX — FINISHED WORK <span class="queue-badge" id="queue-badge">0</span></div>
            <div class="queue" id="queue"></div>
          </div>
        </div>
      </section>
    </div>

    <section class="panel console" id="console-wrap" hidden>
      <div class="panel-inner">
        <div class="panel-head">RUN CONSOLE</div>
        <pre id="console-log"></pre>
      </div>
    </section>

    <p class="footer-note">
      Local approve / reject only saves a decision. This hub does not send mail.
    </p>
  </div>
  <script>
window.__AGENT_ROOMS_STATIC__ = true;
window.__SNAPSHOT_LABEL__ = "Snapshot taken 11:19 AM MST (Phoenix)";
window.__ROOM_DATA__ = {"id": "merch", "name": "Merch Agent", "short": "Merch", "kind": "merch", "character": "designer", "accent": "orange", "invite_url": null, "blurb": "Scores t-shirt and mug niches, drafts typography designs and Etsy/Redbubble listing copy. Nothing is listed until Robert approves.", "folder_exists": true, "live_wired": false, "live_note": "Live feed not wired yet. Showing existing outputs read-only.", "queue_enabled": true, "status": {"state": "idle", "current_step": "Idle", "current_source": null, "counts": {"sources_scanned": 0, "items_found": 0, "scored": 0, "drafts": 0, "pending": 0}, "last_updated": null, "error": null, "current_draft_id": null, "inferred": true, "live_wired": false}, "events": [], "drafts": [], "opportunities": [], "businesses": [], "candidates": [], "leads": [], "content": [], "merch": [], "income": {"totals": [], "items": []}, "panels": [{"type": "merch", "title": "Designs", "items": []}], "run": {"available": false, "running": false, "detected_command": null, "note": "Snapshot only — run the agent from the local dashboard."}, "badges": [], "snapshot_label": "Snapshot taken 11:19 AM MST (Phoenix)", "snapshot_taken": "2026-11-22T11:19:54-07:00"};
</script>
<script type="module" src="../js/room.js"></script>
</body>
</html>
